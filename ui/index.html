<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Mahjong Solitaire — vertical slice</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #14532d;
        font-family: system-ui, sans-serif;
        /* Core play is single taps only (spec §7): no double-tap zoom. */
        touch-action: manipulation;
      }
      /* --- HUD placement (issue #37) ---------------------------------------
         The HUD takes one edge and the board fits into what is left, so the
         edge it takes decides the tile size. `data-hud` is set by main.ts,
         which measures the board area each placement would leave and keeps the
         one that fits the board larger — see src/hud-fit.ts. The two cases
         differ only in flex direction here; everything below the fold (board,
         canvas, a11y layer, rail) is placement-agnostic.

         The rail goes on the *left*: the booster rail (bottom-right) and the
         settings button (top-right) already live on the right edge of the
         board, and a third right-hand column would crowd both. */
      #app {
        display: flex;
        height: 100%;
      }
      /* Until main.ts has measured, there is no honest answer — and guessing
         one (say, from an orientation media query) would mean a second, worse
         placement rule that disagrees with the real one on some layouts. So
         hold the HUD back instead of painting it on the wrong edge and moving
         it: `visibility` keeps the element in layout, so the measurement below
         still works, and the body's green is what shows meanwhile. */
      #app:not([data-hud]) {
        visibility: hidden;
      }
      #app[data-hud='top'] {
        flex-direction: column;
      }
      #app[data-hud='side'] {
        flex-direction: row;
      }
      header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        color: #f0fdf4;
        font-size: 18px; /* spec §7: ≥ 18sp body */
        flex-wrap: wrap;
      }
      #app[data-hud='side'] > header {
        /* A column of full-width rows. 120px is the narrowest that holds "New
           game" on one line at 16px; the board gets every px beyond that, and
           if a longer locale or Dynamic Type needs more, the measured fit sees
           the real width rather than this number. */
        flex: none;
        width: 120px;
        flex-direction: column;
        align-items: stretch;
        justify-content: flex-start;
        gap: 8px;
        padding: 8px;
        font-size: 16px;
        overflow-y: auto;
      }
      #app[data-hud='side'] > header button {
        font-size: 16px;
        padding: 8px 6px;
      }
      header .stat {
        min-width: 90px;
      }
      #app[data-hud='side'] header .stat {
        min-width: 0;
      }
      header button {
        font-size: 18px;
        min-height: 48px; /* spec §7: 48dp touch targets */
        min-width: 48px;
        padding: 8px 12px;
        border-radius: 8px;
        border: 1px solid #bbf7d0;
        background: #166534;
        color: #f0fdf4;
      }
      /* --- Boosters (issue #13) --------------------------------------------
         A vertical rail in the bottom-right corner of the board: thumb-reach on
         a phone, and it keeps the HUD header to one row. The rail sits above
         the canvas and below the end-of-level dialog, and it is inerted with
         the rest of the background while that dialog is open.
         Charge count rides in a badge on each button. Buttons stay enabled at
         zero charges: pressing one then says why nothing happened, which a
         `disabled` control cannot do (and some assistive technology skips
         disabled controls entirely). `.spent` is the visual half of that. */
      #booster-rail {
        position: absolute;
        right: calc(12px + env(safe-area-inset-right, 0px));
        bottom: calc(12px + env(safe-area-inset-bottom, 0px));
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      #booster-rail button {
        position: relative;
        display: grid;
        place-items: center;
        /* Icon-only: 56dp square, comfortably over the spec §7 48dp minimum.
           The icon carries no name — the accessible name is the button's
           aria-label, kept in sync with the balance by main.ts. */
        width: 56px;
        height: 56px;
        padding: 0;
        border-radius: 10px;
        border: 1px solid #bbf7d0;
        background: #166534;
        color: #f0fdf4;
      }
      #booster-rail svg {
        width: 28px;
        height: 28px;
        fill: none;
        stroke: currentColor;
        /* Heavy stroke: a hairline outline reads as mostly empty space at
           28px, and these are the HUD's only unlabelled controls. */
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      /* Solid masses — the bulb body and the arrowheads — so each glyph reads
         as a shape rather than an outline of one. */
      #booster-rail svg .solid {
        fill: currentColor;
        stroke: none;
      }
      #booster-rail .charges {
        position: absolute;
        top: -7px;
        right: -7px;
        min-width: 22px;
        padding: 1px 5px;
        border-radius: 999px;
        border: 1px solid #14532d;
        background: #bbf7d0;
        color: #14532d;
        font-size: 14px;
        font-weight: bold;
        line-height: 1.4;
      }
      #booster-rail button.spent {
        opacity: 0.6;
      }
      #booster-rail button.spent .charges {
        background: #86a894;
      }
      /* Keep the stats + New game + Restart on one phone row, so the header
         costs the board one row of height, not two — which is also what makes
         the top bar competitive with the side rail in portrait (issue #37). */
      @media (max-width: 560px) {
        header {
          gap: 6px;
          padding: 6px 8px;
          font-size: 16px;
        }
        header .stat {
          min-width: 0;
        }
        header button {
          font-size: 16px;
          padding: 8px 10px;
        }
      }
      #board {
        flex: 1;
        position: relative;
        min-height: 0;
      }
      #board canvas {
        position: absolute;
        inset: 0;
      }
      #overlay {
        position: absolute;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.55);
      }
      #overlay.visible {
        display: flex;
      }
      #overlay .card {
        background: #f0fdf4;
        color: #14532d;
        border-radius: 12px;
        padding: 24px 32px;
        text-align: center;
        max-width: 90vw;
      }
      #overlay .card h2 {
        margin-top: 0;
        font-size: 24px;
      }
      #overlay .card button {
        font-size: 18px;
        min-height: 48px;
        min-width: 48px;
        padding: 8px 20px;
        margin: 4px;
        border-radius: 8px;
        border: 1px solid #14532d;
        background: #166534;
        color: #f0fdf4;
      }

      /* Settings entry point: a rail-style icon button in the opposite corner
         to the boosters, so neither crowds the other. */
      #btn-settings {
        position: absolute;
        top: calc(8px + env(safe-area-inset-top, 0px));
        right: calc(12px + env(safe-area-inset-right, 0px));
        display: grid;
        place-items: center;
        width: 48px; /* spec §7: 48dp minimum */
        height: 48px;
        padding: 0;
        border-radius: 10px;
        border: 1px solid #bbf7d0;
        background: #166534;
        color: #f0fdf4;
      }
      #btn-settings svg {
        width: 28px;
        height: 28px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2.2;
        stroke-linecap: round;
      }
      #btn-settings svg .solid {
        fill: currentColor;
        stroke: none;
      }

      /* --- Settings screen (issue #14) -------------------------------------
         Same card language as the end-of-level dialog, one tap from the board
         (spec §7: every action within 2 taps). Rows are whole-row labels so
         the touch target is the text as well as the control, and the card
         scrolls rather than overflowing a small phone in landscape. */
      #settings {
        position: absolute;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.55);
      }
      #settings.visible {
        display: flex;
      }
      #settings .card {
        background: #f0fdf4;
        color: #14532d;
        border-radius: 12px;
        padding: 20px 24px;
        max-width: min(420px, 92vw);
        max-height: 88%;
        overflow-y: auto;
        text-align: left;
        font-size: 18px; /* spec §7: ≥ 18sp body */
      }
      #settings h2 {
        margin: 0 0 12px;
        font-size: 24px;
      }
      #settings fieldset {
        margin: 12px 0 0;
        padding: 8px 12px 12px;
        border: 1px solid #bbf7d0;
        border-radius: 8px;
      }
      #settings legend {
        padding: 0 6px;
        font-weight: bold;
      }
      #settings .row {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 48px; /* spec §7: 48dp touch targets */
        padding: 6px 0;
        cursor: pointer;
      }
      /* Two of the rows carry a second line of hint text, so without a rule
         between them the four toggles read as one block of prose. */
      #settings .card > .row + .row,
      #settings fieldset .row + .row {
        border-top: 1px solid #d1fae5;
      }
      #settings input[type='checkbox'],
      #settings input[type='radio'] {
        flex: none;
        width: 26px;
        height: 26px;
        accent-color: #166534;
      }
      #settings .hint {
        display: block;
        font-size: 15px;
        color: #3f6212;
      }
      #settings .card > button {
        margin-top: 16px;
        width: 100%;
        font-size: 18px;
        min-height: 48px;
        padding: 8px 20px;
        border-radius: 8px;
        border: 1px solid #14532d;
        background: #166534;
        color: #f0fdf4;
      }

      /* --- Accessibility layer (issue #12) ---------------------------------
         Canvas tiles have no semantics tree, so each tile is mirrored by a
         real <button> here. The layer is transparent and pointer-transparent:
         sighted taps fall through to the canvas (keeping the single 8dp
         mis-tap-forgiveness path), while keyboard and VoiceOver/TalkBack
         activation dispatch click straight at the button. */
      #a11y-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      #a11y-layer .tile-node {
        position: absolute;
        margin: 0;
        padding: 0;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: transparent;
        font: inherit;
        appearance: none;
        /* spec §7: never below the 48dp minimum touch target — enforced in
           script (focusRect) because the size tracks the board scale. */
        min-width: 48px;
        min-height: 48px;
      }
      #a11y-layer .tile-node:focus {
        outline: none;
      }
      #a11y-layer .tile-node:focus-visible {
        outline: 4px solid #f59e0b;
        outline-offset: 2px;
      }
      /* Visually hidden, still announced. */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <!-- No data-hud: the HUD placement (issue #37) is whatever main.ts measures,
         and the CSS above keeps #app invisible until it says. Hard-coding "top"
         here instead would paint the header on the wrong edge and then move it
         on every phone in landscape — the one viewport that picks the rail. -->
    <div id="app">
      <header id="app-header">
        <span class="stat">Score <strong id="score">0</strong></span>
        <span class="stat">Tiles <strong id="tiles-left">144</strong></span>
        <!-- Timed mode is opt-in (spec §6), so the readout is hidden until the
             player asks for it in settings. It counts up; nothing runs out. -->
        <span class="stat" id="time-stat" hidden>Time <strong id="elapsed">0:00</strong></span>
        <button id="btn-new" type="button">New game</button>
        <button id="btn-restart" type="button">Restart</button>
      </header>
      <div id="board">
        <div id="a11y-layer"></div>
        <!-- The way into settings lives here rather than in the header: at
             375dp the header is already a full row, and a sixth control there
             wraps it and costs the board 54px of height. Top-right keeps it one
             tap from the board (spec §7) and out of the thumb rail. -->
        <button
          id="btn-settings"
          type="button"
          data-action="Settings"
          title="Settings"
          aria-label="Settings"
        >
          <!-- A gear reads as a gear only with teeth *on* a rim: a hub plus
               loose spokes reads as a sunburst at 26px. -->
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="6.6" />
            <circle class="solid" cx="12" cy="12" r="2.4" />
            <path
              d="M12 5.4V2.2M12 18.6v3.2M5.4 12H2.2M18.6 12h3.2M7.33 7.33 5.07 5.07M16.67 16.67l2.26 2.26M16.67 7.33l2.26-2.26M7.33 16.67l-2.26 2.26"
            />
          </svg>
        </button>
        <div id="booster-rail" role="group" aria-label="Boosters">
          <!-- Placeholder icon art (bulb / back-arrow / crossing arrows), like
               the tile faces. `aria-hidden` on the drawing: the spoken name is
               the button's aria-label, which main.ts keeps in sync with the
               balance; `title` gives sighted players a hover tooltip. -->
          <button
            id="btn-hint"
            type="button"
            data-action="Hint"
            title="Hint"
            aria-label="Hint, 5 charges left"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path class="solid" d="M12 2a6.4 6.4 0 0 0-3.7 11.6V16h7.4v-2.4A6.4 6.4 0 0 0 12 2Z" />
              <path d="M9.4 18.8h5.2" />
              <path d="M10.4 21.6h3.2" />
            </svg>
            <span class="charges" id="charges-hint">5</span>
          </button>
          <button
            id="btn-undo"
            type="button"
            data-action="Undo"
            title="Undo"
            aria-label="Undo, 5 charges left"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7 9h6.5a5.5 5.5 0 1 1 0 11H8" />
              <path class="solid" d="M8.6 3.4 2.8 9l5.8 5.6z" />
            </svg>
            <span class="charges" id="charges-undo">5</span>
          </button>
          <button
            id="btn-shuffle"
            type="button"
            data-action="Shuffle"
            title="Shuffle"
            aria-label="Shuffle, 5 charges left"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3.5 20.5 18.5 5.5" />
              <path d="M3.5 3.5 8.5 8.5" />
              <path d="M14 14l4.5 4.5" />
              <path class="solid" d="M13.5 3.5h7v7z" />
              <path class="solid" d="M20.5 13.5v7h-7z" />
            </svg>
            <span class="charges" id="charges-shuffle">5</span>
          </button>
        </div>
        <div
          id="overlay"
          role="dialog"
          aria-modal="true"
          aria-labelledby="overlay-title"
          aria-describedby="overlay-text"
        >
          <div class="card">
            <h2 id="overlay-title"></h2>
            <p id="overlay-text"></p>
            <!-- Deadlock way out (spec §4: never hard-fail the player); shown
                 only for the stuck dialog, hidden on a win. -->
            <button id="overlay-shuffle" type="button" data-action="Shuffle" hidden>Shuffle</button>
            <button id="overlay-undo" type="button" data-action="Undo" hidden>Undo</button>
            <button id="overlay-restart" type="button">Restart level</button>
            <button id="overlay-new" type="button">New game</button>
          </div>
        </div>
        <div id="settings" role="dialog" aria-modal="true" aria-labelledby="settings-title">
          <div class="card">
            <h2 id="settings-title">Settings</h2>
            <!-- Audio and haptics are separate checkboxes on purpose: spec §7
                 wants them independently toggleable, both ON by default. -->
            <label class="row" for="set-audio">
              <input type="checkbox" id="set-audio" />
              <span>Sound effects</span>
            </label>
            <label class="row" for="set-haptics">
              <input type="checkbox" id="set-haptics" />
              <span>Vibration</span>
            </label>
            <label class="row" for="set-timed">
              <input type="checkbox" id="set-timed" />
              <span>
                Show a timer
                <span class="hint">Counts up. There is never a time limit.</span>
              </span>
            </label>
            <label class="row" for="set-ads">
              <input type="checkbox" id="set-ads" />
              <span>
                Show ads
                <span class="hint">Off by default. The game is complete without them.</span>
              </span>
            </label>
            <fieldset>
              <legend>Tile size</legend>
              <label class="row" for="set-size-s">
                <input type="radio" name="tile-size" id="set-size-s" value="s" />
                <span>Small</span>
              </label>
              <label class="row" for="set-size-m">
                <input type="radio" name="tile-size" id="set-size-m" value="m" />
                <span>Medium</span>
              </label>
              <label class="row" for="set-size-l">
                <input type="radio" name="tile-size" id="set-size-l" value="l" />
                <span>Large</span>
              </label>
              <label class="row" for="set-size-xl">
                <input type="radio" name="tile-size" id="set-size-xl" value="xl" />
                <span>Extra large</span>
              </label>
            </fieldset>
            <button id="settings-close" type="button">Done</button>
          </div>
        </div>
      </div>
      <div id="a11y-status" class="sr-only" role="status" aria-live="polite"></div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
