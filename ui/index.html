<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Mahjong Solitaire — vertical slice</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #14532d;
        font-family: system-ui, sans-serif;
        /* Core play is single taps only (spec §7): no double-tap zoom. */
        touch-action: manipulation;
      }
      /* --- HUD placement (issue #37) ---------------------------------------
         The HUD takes one edge and the board fits into what is left, so the
         edge it takes decides the tile size. `data-hud` is set by main.ts,
         which measures the board area each placement would leave and keeps the
         one that fits the board larger — see src/hud-fit.ts. The two cases
         differ only in flex direction here; everything below the fold (board,
         canvas, a11y layer, rail) is placement-agnostic.

         The rail goes on the *left*: the booster rail (bottom-right) and the
         settings button (top-right) already live on the right edge of the
         board, and a third right-hand column would crowd both. */
      #app {
        display: flex;
        height: 100%;
      }
      /* Until main.ts has measured, there is no honest answer — and guessing
         one (say, from an orientation media query) would mean a second, worse
         placement rule that disagrees with the real one on some layouts. So
         hold the HUD back instead of painting it on the wrong edge and moving
         it: `visibility` keeps the element in layout, so the measurement below
         still works, and the body's green is what shows meanwhile. */
      #app:not([data-hud]) {
        visibility: hidden;
      }
      #app[data-hud='top'] {
        flex-direction: column;
      }
      #app[data-hud='side'] {
        flex-direction: row;
      }
      header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        color: #f0fdf4;
        font-size: 18px; /* spec §7: ≥ 18sp body */
        flex-wrap: wrap;
      }
      #app[data-hud='side'] > header {
        /* A column of full-width rows. 120px is the narrowest that holds "New
           game" on one line at 16px; the board gets every px beyond that, and
           if a longer locale or Dynamic Type needs more, the measured fit sees
           the real width rather than this number. */
        flex: none;
        width: 120px;
        flex-direction: column;
        align-items: stretch;
        justify-content: flex-start;
        gap: 8px;
        padding: 8px;
        font-size: 16px;
        overflow-y: auto;
      }
      #app[data-hud='side'] > header button {
        font-size: 16px;
        padding: 8px 6px;
      }
      /* The icon buttons keep their square shape in the side column — the
         rule above is for text buttons and would restore padding. */
      #app[data-hud='side'] > header .hud-actions button {
        padding: 0;
      }
      /* Stat chips (HUD rework, 2026-09-01): a quiet uppercase label over a
         big tabular number, on a faint card so the pair reads as one gauge.
         The score is the exciting one — gold, with a glow and a pop keyed by
         main.ts on every gain (reduced motion drops the pop below). */
      header .stat {
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        min-width: 76px;
        padding: 3px 12px 5px;
        border: 1px solid #2e7d4f;
        border-radius: 10px;
        background: rgba(240, 253, 244, 0.08);
      }
      header .stat-label {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: #86efac;
      }
      header .stat-value {
        display: inline-block;
        font-size: 22px;
        line-height: 1.15;
        font-variant-numeric: tabular-nums;
      }
      header .stat.score .stat-value {
        color: #fcd34d;
        text-shadow: 0 0 10px rgba(252, 211, 77, 0.35);
      }
      @keyframes score-pop {
        35% {
          transform: scale(1.25);
        }
      }
      header .stat-value.bump {
        animation: score-pop 300ms ease;
      }
      @media (prefers-reduced-motion: reduce) {
        header .stat-value.bump {
          animation: none;
        }
      }
      #app[data-motion='reduced'] header .stat-value.bump {
        animation: none;
      }
      #app[data-hud='side'] header .stat {
        min-width: 0;
      }
      header button {
        font-size: 18px;
        min-height: 48px; /* spec §7: 48dp touch targets */
        min-width: 48px;
        padding: 8px 12px;
        border-radius: 8px;
        border: 1px solid #bbf7d0;
        background: #166534;
        color: #f0fdf4;
      }
      /* New game / Restart as icon buttons (HUD rework): same material as the
         booster rail, pushed to the header's far edge so the chips lead. */
      .hud-actions {
        display: flex;
        gap: 8px;
        margin-left: auto;
      }
      #app[data-hud='side'] .hud-actions {
        margin-left: 0;
        justify-content: center;
      }
      .hud-actions button {
        display: grid;
        place-items: center;
        width: 48px; /* spec §7: 48dp minimum */
        height: 48px;
        padding: 0;
        border-radius: 10px;
      }
      .hud-actions svg {
        width: 26px;
        height: 26px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .hud-actions svg .solid {
        fill: currentColor;
        stroke: none;
      }
      /* --- Boosters (issue #13) --------------------------------------------
         A vertical rail in the bottom-right corner of the board: thumb-reach on
         a phone, and it keeps the HUD header to one row. The rail sits above
         the canvas and below the end-of-level dialog, and it is inerted with
         the rest of the background while that dialog is open.
         Charge count rides in a badge on each button. Buttons stay enabled at
         zero charges: pressing one then says why nothing happened, which a
         `disabled` control cannot do (and some assistive technology skips
         disabled controls entirely). `.spent` is the visual half of that. */
      #booster-rail {
        position: absolute;
        right: calc(12px + env(safe-area-inset-right, 0px));
        bottom: calc(12px + env(safe-area-inset-bottom, 0px));
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      /* Portrait (top HUD): the issue #99 boards fill the full height, so a
         vertical right rail would sit on the bottom-right tiles — occluding
         them and stealing their taps. Lay the rail flat along the bottom and
         reserve that band under #board so the fit never puts a tile there. */
      #app[data-hud='top'] #booster-rail {
        flex-direction: row;
        right: 50%;
        transform: translateX(50%);
        /* The rail is a child of #board: anchor it into the reserved band
           below the board's box, not onto its bottom tiles. */
        top: calc(100% + 12px);
        bottom: auto;
      }
      #app[data-hud='top'] #board {
        margin-bottom: calc(80px + env(safe-area-inset-bottom, 0px));
      }
      /* Side HUD: same reservation, on the right — the vertical rail gets its
         own band beside the board instead of floating over its corner. The
         chooser (issue #37) measures #board per candidate, so both placements
         are priced honestly, reservation included. */
      #app[data-hud='side'] #board {
        margin-right: calc(80px + env(safe-area-inset-right, 0px));
      }
      #app[data-hud='side'] #booster-rail {
        left: calc(100% + 12px);
        right: auto;
      }
      #booster-rail button {
        position: relative;
        display: grid;
        place-items: center;
        /* Icon-only: 56dp square, comfortably over the spec §7 48dp minimum.
           The icon carries no name — the accessible name is the button's
           aria-label, kept in sync with the balance by main.ts. */
        width: 56px;
        height: 56px;
        padding: 0;
        border-radius: 10px;
        border: 1px solid #bbf7d0;
        background: #166534;
        color: #f0fdf4;
      }
      #booster-rail svg {
        width: 28px;
        height: 28px;
        fill: none;
        stroke: currentColor;
        /* Heavy stroke: a hairline outline reads as mostly empty space at
           28px, and these are the HUD's only unlabelled controls. */
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      /* Solid masses — the bulb body and the arrowheads — so each glyph reads
         as a shape rather than an outline of one. */
      #booster-rail svg .solid {
        fill: currentColor;
        stroke: none;
      }
      #booster-rail .charges {
        position: absolute;
        top: -7px;
        right: -7px;
        min-width: 22px;
        padding: 1px 5px;
        border-radius: 999px;
        border: 1px solid #14532d;
        background: #bbf7d0;
        color: #14532d;
        font-size: 14px;
        font-weight: bold;
        line-height: 1.4;
      }
      #booster-rail button.spent {
        opacity: 0.6;
      }
      #booster-rail button.spent .charges {
        background: #86a894;
      }
      /* Keep the stats + New game + Restart on one phone row, so the header
         costs the board one row of height, not two — which is also what makes
         the top bar competitive with the side rail in portrait (issue #37). */
      @media (max-width: 560px) {
        header {
          gap: 6px;
          padding: 6px 8px;
          font-size: 16px;
        }
        header .stat {
          min-width: 0;
        }
        header button {
          font-size: 16px;
          padding: 8px 10px;
        }
      }
      /* --- Holder (issue #43) ----------------------------------------------
         A row of slot buttons above the board, inside a column the board
         shares. Being in the flow (rather than absolutely positioned over the
         canvas like the booster rail) is the point: the strip's height comes
         off the board's fit, so a parked tile can never sit on top of a tile
         that is still in play.

         Slots keep the spec §7 48dp minimum in both axes and are painted from
         the renderer's own palette when filled (see src/holder.ts) — an empty
         slot is a dashed outline, so four of them read as "this is a place
         tiles can go" before the player has used one. */
      #play-area {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
      }
      /* The strip follows the HUD's own axis (issue #37): a row above the board
         when the HUD took the top edge, a column beside it when the HUD took a
         side. Landscape has width to spare and no height to spare, and a 68px
         row there cost the board a sixth of its height — a 60px column costs it
         a fourteenth of its width. Both cases are *measured*, not assumed:
         applyHudPlacement reads #board back per candidate, so the strip's
         footprint is already part of the placement decision. */
      #app[data-hud='top'] #play-area {
        flex-direction: column;
      }
      #app[data-hud='side'] #play-area {
        flex-direction: row;
      }
      #holder {
        flex: none;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        padding: 6px 8px;
      }
      #app[data-hud='side'] #holder {
        flex-direction: column;
        padding: 8px 6px;
      }
      /* A slot is a 48dp-minimum button (spec §7) around a tile-sized visual:
         the .tile span is sized by holder.ts to the board's current on-screen
         tile size (issue #66), so a parked tile and a board tile always read
         the same — the button only outgrows it when tiles drop below 48dp. */
      #holder .slot {
        position: relative;
        display: grid;
        place-items: center;
        min-width: 48px;
        min-height: 48px;
        padding: 0;
        border: none;
        background: transparent;
      }
      /* Empty look: a dashed tile-sized placeholder. Filled: the renderer's
         own picture of the parked tile (face, side depth, pips, corner tag),
         set as this span's background by holder.ts — same material as the
         board, no second implementation of the art. */
      #holder .slot .tile {
        display: block;
        box-sizing: border-box;
        border: 2px dashed #4d7c5a;
        border-radius: 8px;
        background: transparent center / 100% 100% no-repeat;
      }
      #holder .slot.filled .tile {
        border: none;
        border-radius: 0;
      }
      /* The last empty slot (issue #63). Filling it ends the level, so it is
         marked before the player takes the step, not explained afterwards.
         Amber and a heavier dash — a colour *and* a weight change, because
         spec §7 forbids carrying meaning on colour alone; the slot's own
         accessible name and the selected tile's both spell it out too. */
      #holder .slot.last .tile {
        border-color: #f59e0b;
        border-width: 3px;
      }
      /* Pressed state (issue #95): every real control darkens and sinks while
         the pointer or Space key is down, and releases back. The board's tile
         proxies (.tile-node — invisible, the canvas carries their visuals) and
         the holder's informational slots are excluded; disabled buttons never
         press. Reduced motion — the OS preference via the media query below,
         the in-app toggle via [data-motion='reduced'] (main.ts) — drops the
         transition so the swap is instant, which the ticket allows. */
      button:not(.tile-node):not(.slot) {
        transition:
          transform 60ms ease,
          filter 60ms ease;
      }
      button:active:not(:disabled):not(.tile-node):not(.slot) {
        transform: translateY(1px) scale(0.97);
        filter: brightness(0.85);
      }
      @media (prefers-reduced-motion: reduce) {
        button:not(.tile-node):not(.slot) {
          transition: none;
        }
      }
      #app[data-motion='reduced'] button:not(.tile-node):not(.slot) {
        transition: none;
      }

      /* The hint cue, in the board's colour (render.ts). */
      #holder .slot.hinted {
        outline: 3px solid #2563eb;
        outline-offset: 1px;
      }
      /* A tile is flying to this slot (issue #93, tray-fx.ts): the redraw has
         already filled it, so hide the picture until the copy lands. */
      #holder .slot.incoming .tile {
        visibility: hidden;
      }
      /* Tray effects overlay (issue #93): flights from board to holder, the
         side-by-side pair clear, the score popup and the sparks. Fixed and
         pointer-transparent — copies are pictures, never controls. */
      #fx-layer {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 30;
      }
      #fx-layer .fx-tile {
        position: fixed;
        background: transparent center / 100% 100% no-repeat;
        will-change: transform, opacity;
      }
      #fx-layer .fx-score {
        position: fixed;
        transform: translate(-50%, -50%);
        font-weight: 700;
        font-size: 20px;
        color: #fff6d8;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
        will-change: transform, opacity;
      }
      #fx-layer .fx-spark {
        position: fixed;
        border-radius: 50%;
        transform: translate(-50%, -50%);
        will-change: transform, opacity;
      }
      #board {
        flex: 1;
        position: relative;
        min-height: 0;
      }
      #board canvas {
        position: absolute;
        inset: 0;
      }
      #overlay {
        position: absolute;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        /* Above #fx-layer (z-index 30): the modal must cover a pair clear
           still playing out — a win always ends with one (issue #93). */
        z-index: 40;
        background: rgba(0, 0, 0, 0.55);
      }
      #overlay.visible {
        display: flex;
      }
      #overlay .card {
        background: #f0fdf4;
        color: #14532d;
        border-radius: 12px;
        padding: 24px 32px;
        text-align: center;
        max-width: 90vw;
      }
      #overlay .card h2 {
        margin-top: 0;
        font-size: 24px;
      }
      #overlay .card button {
        font-size: 18px;
        min-height: 48px;
        min-width: 48px;
        padding: 8px 20px;
        margin: 4px;
        border-radius: 8px;
        border: 1px solid #14532d;
        background: #166534;
        color: #f0fdf4;
      }

      /* Settings entry point: a rail-style icon button in the opposite corner
         to the boosters, so neither crowds the other. */
      #btn-settings {
        position: absolute;
        top: calc(8px + env(safe-area-inset-top, 0px));
        right: calc(12px + env(safe-area-inset-right, 0px));
        display: grid;
        place-items: center;
        width: 48px; /* spec §7: 48dp minimum */
        height: 48px;
        padding: 0;
        border-radius: 10px;
        border: 1px solid #bbf7d0;
        background: #166534;
        color: #f0fdf4;
      }
      #btn-settings svg {
        width: 28px;
        height: 28px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2.2;
        stroke-linecap: round;
      }
      #btn-settings svg .solid {
        fill: currentColor;
        stroke: none;
      }

      /* --- Settings screen (issue #14) -------------------------------------
         Same card language as the end-of-level dialog, one tap from the board
         (spec §7: every action within 2 taps). Rows are whole-row labels so
         the touch target is the text as well as the control, and the card
         scrolls rather than overflowing a small phone in landscape. */
      #settings,
      #changelog,
      #profile {
        position: absolute;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.55);
      }
      #settings.visible,
      #changelog.visible,
      #profile.visible {
        display: flex;
      }
      #settings .card,
      #changelog .card,
      #profile .card {
        background: #f0fdf4;
        color: #14532d;
        border-radius: 12px;
        padding: 20px 24px;
        max-width: min(420px, 92vw);
        max-height: 88%;
        overflow-y: auto;
        text-align: left;
        font-size: 18px; /* spec §7: ≥ 18sp body */
      }
      #settings h2,
      #changelog h2,
      #profile h2 {
        margin: 0 0 12px;
        font-size: 24px;
      }
      #changelog h3 {
        margin: 16px 0 4px;
        font-size: 18px;
      }
      #changelog ul {
        margin: 4px 0;
        padding-left: 22px;
      }
      #changelog li {
        margin: 4px 0;
      }
      #changelog p {
        margin: 4px 0;
        font-size: 15px;
        color: #3f6212;
      }
      #settings fieldset,
      #profile fieldset {
        margin: 12px 0 0;
        padding: 8px 12px 12px;
        border: 1px solid #bbf7d0;
        border-radius: 8px;
      }
      #settings legend,
      #profile legend {
        padding: 0 6px;
        font-weight: bold;
      }
      #settings .row,
      #profile .row {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 48px; /* spec §7: 48dp touch targets */
        padding: 6px 0;
        cursor: pointer;
      }
      /* Two of the rows carry a second line of hint text, so without a rule
         between them the four toggles read as one block of prose. */
      #settings .card > .row + .row,
      #settings fieldset .row + .row {
        border-top: 1px solid #d1fae5;
      }
      #settings input[type='checkbox'],
      #settings input[type='radio'] {
        flex: none;
        width: 26px;
        height: 26px;
        accent-color: #166534;
      }
      #settings .hint {
        display: block;
        font-size: 15px;
        color: #3f6212;
      }
      #settings .card > button,
      #changelog .card > button,
      #profile .card > button {
        margin-top: 16px;
        width: 100%;
        font-size: 18px;
        min-height: 48px;
        padding: 8px 20px;
        border-radius: 8px;
        border: 1px solid #14532d;
        background: #166534;
        color: #f0fdf4;
      }
      /* The version row reads as a settings row, not a primary action
         (issue #81); only the Done button keeps the filled style. The profile
         row (issue #69) is the same idiom: a row that opens another screen. */
      #settings .card > button.version-row,
      #settings .card > button.profile-row {
        margin-top: 12px;
        text-align: left;
        border: none;
        background: none;
        color: inherit;
        padding: 6px 0;
        border-radius: 0;
        border-top: 1px solid #d1fae5;
      }
      #settings .card > button.profile-row {
        margin-top: 0;
        border-top: none;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      /* --- Profile screen (issue #69) ---------------------------------------
         The avatar is drawn as a glyph, sized like a tile face; the picker is
         a radio grid so it works exactly like the tile-size choice. */
      .avatar-glyph {
        font-size: 32px;
        line-height: 1;
      }
      #profile input[type='text'] {
        flex: 1;
        min-width: 0;
        min-height: 48px; /* spec §7: 48dp touch targets */
        font-size: 18px;
        padding: 6px 10px;
        border: 1px solid #bbf7d0;
        border-radius: 8px;
        background: #ffffff;
        color: #14532d;
      }
      #profile .avatar-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 4px;
      }
      #profile .avatar-grid label {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        min-height: 48px; /* spec §7 */
        padding: 6px 0;
        cursor: pointer;
      }
      #profile .avatar-grid input[type='radio'] {
        width: 22px;
        height: 22px;
        accent-color: #166534;
      }
      #profile .record-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 6px 0;
      }
      #profile .record-row + .record-row {
        border-top: 1px solid #d1fae5;
      }
      #profile .record-hint {
        margin: 6px 0 0;
        font-size: 15px;
        color: #3f6212;
      }

      /* --- Accessibility layer (issue #12) ---------------------------------
         Canvas tiles have no semantics tree, so each tile is mirrored by a
         real <button> here. The layer is transparent and pointer-transparent:
         sighted taps fall through to the canvas (keeping the single 8dp
         mis-tap-forgiveness path), while keyboard and VoiceOver/TalkBack
         activation dispatch click straight at the button. */
      #a11y-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      #a11y-layer .tile-node {
        position: absolute;
        margin: 0;
        padding: 0;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: transparent;
        font: inherit;
        appearance: none;
        /* spec §7: never below the 48dp minimum touch target — enforced in
           script (focusRect) because the size tracks the board scale. */
        min-width: 48px;
        min-height: 48px;
      }
      #a11y-layer .tile-node:focus {
        outline: none;
      }
      #a11y-layer .tile-node:focus-visible {
        outline: 4px solid #f59e0b;
        outline-offset: 2px;
      }
      /* Visually hidden, still announced. */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <!-- No data-hud: the HUD placement (issue #37) is whatever main.ts measures,
         and the CSS above keeps #app invisible until it says. Hard-coding "top"
         here instead would paint the header on the wrong edge and then move it
         on every phone in landscape — the one viewport that picks the rail. -->
    <div id="app">
      <!-- The HUD (reworked 2026-09-01, PM request): Level and Score as stat
           chips — small caps label over a big number, the score in gold with a
           pop on every gain — and the two deal actions as icon buttons. The
           Tiles counter is gone: the board already shows what is left, and the
           screen-reader announcements still speak the count. -->
      <header id="app-header">
        <span class="stat">
          <span class="stat-label">Level</span>
          <strong class="stat-value" id="level">1</strong>
        </span>
        <span class="stat score">
          <span class="stat-label">Score</span>
          <strong class="stat-value" id="score">0</strong>
        </span>
        <!-- Timed mode is opt-in (spec §6), so the readout is hidden until the
             player asks for it in settings. It counts up; nothing runs out. -->
        <span class="stat" id="time-stat" hidden>
          <span class="stat-label">Time</span>
          <strong class="stat-value" id="elapsed">0:00</strong>
        </span>
        <span class="hud-actions">
          <!-- Icon-only, like the booster rail: the accessible name is the
               aria-label, `title` gives sighted players the tooltip. -->
          <button
            id="btn-new"
            type="button"
            data-action="New game"
            title="New game"
            aria-label="New game"
          >
            <!-- A fresh deal: a plus. -->
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 5.2v13.6M5.2 12h13.6" />
            </svg>
          </button>
          <button
            id="btn-restart"
            type="button"
            data-action="Restart"
            title="Restart level"
            aria-label="Restart level"
          >
            <!-- Replay the same deal: a circular arrow. -->
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 4.8a7.2 7.2 0 1 0 7.2 7.2" />
              <path class="solid" d="M12.2 1.2v7.2l6-3.6z" />
            </svg>
          </button>
        </span>
      </header>
      <!-- Holder (issue #43) + board share a column, so the strip is above the
           board whichever edge the HUD took (issue #37). The strip is a flex
           sibling of #board, which is what Pixi sizes to: it takes its own
           height out of the fit and the board re-fits around it. -->
      <div id="play-area">
        <div id="holder"></div>
        <div id="fx-layer"></div>
        <div id="board">
          <div id="a11y-layer"></div>
          <!-- The way into settings lives here rather than in the header: at
               375dp the header is already a full row, and a sixth control there
               wraps it and costs the board 54px of height. Top-right keeps it one
               tap from the board (spec §7) and out of the thumb rail. -->
          <button
            id="btn-settings"
            type="button"
            data-action="Settings"
            title="Settings"
            aria-label="Settings"
          >
            <!-- A gear reads as a gear only with teeth *on* a rim: a hub plus
                 loose spokes reads as a sunburst at 26px. -->
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="6.6" />
              <circle class="solid" cx="12" cy="12" r="2.4" />
              <path
                d="M12 5.4V2.2M12 18.6v3.2M5.4 12H2.2M18.6 12h3.2M7.33 7.33 5.07 5.07M16.67 16.67l2.26 2.26M16.67 7.33l2.26-2.26M7.33 16.67l-2.26 2.26"
              />
            </svg>
          </button>
          <div id="booster-rail" role="group" aria-label="Boosters">
            <!-- Placeholder icon art (bulb / back-arrow / crossing arrows), like
                 the tile faces. `aria-hidden` on the drawing: the spoken name is
                 the button's aria-label, which main.ts keeps in sync with the
                 balance; `title` gives sighted players a hover tooltip. -->
            <button
              id="btn-hint"
              type="button"
              data-action="Hint"
              title="Hint"
              aria-label="Hint, 5 charges left"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path class="solid" d="M12 2a6.4 6.4 0 0 0-3.7 11.6V16h7.4v-2.4A6.4 6.4 0 0 0 12 2Z" />
                <path d="M9.4 18.8h5.2" />
                <path d="M10.4 21.6h3.2" />
              </svg>
              <span class="charges" id="charges-hint">5</span>
            </button>
            <button
              id="btn-undo"
              type="button"
              data-action="Undo"
              title="Undo"
              aria-label="Undo, 5 charges left"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M7 9h6.5a5.5 5.5 0 1 1 0 11H8" />
                <path class="solid" d="M8.6 3.4 2.8 9l5.8 5.6z" />
              </svg>
              <span class="charges" id="charges-undo">5</span>
            </button>
            <button
              id="btn-shuffle"
              type="button"
              data-action="Shuffle"
              title="Shuffle"
              aria-label="Shuffle, 5 charges left"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3.5 20.5 18.5 5.5" />
                <path d="M3.5 3.5 8.5 8.5" />
                <path d="M14 14l4.5 4.5" />
                <path class="solid" d="M13.5 3.5h7v7z" />
                <path class="solid" d="M20.5 13.5v7h-7z" />
              </svg>
              <span class="charges" id="charges-shuffle">5</span>
            </button>
          </div>
          <div
            id="overlay"
            role="dialog"
            aria-modal="true"
            aria-labelledby="overlay-title"
            aria-describedby="overlay-text"
          >
            <div class="card">
              <h2 id="overlay-title"></h2>
              <p id="overlay-text"></p>
              <!-- Deadlock way out (spec §4: never hard-fail the player); shown
                   only for the stuck dialog, hidden on a win. -->
              <button id="overlay-shuffle" type="button" data-action="Shuffle" hidden>Shuffle</button>
              <button id="overlay-undo" type="button" data-action="Undo" hidden>Undo</button>
              <button id="overlay-restart" type="button">Restart level</button>
              <button id="overlay-new" type="button">New game</button>
            </div>
          </div>
          <!-- Profile (issue #69): a local identity — no account, no sign-in —
               and the player's own record. Opened from Settings; every edit
               writes through immediately, like the settings themselves. -->
          <div id="profile" role="dialog" aria-modal="true" aria-labelledby="profile-title">
            <div class="card">
              <h2 id="profile-title">Profile</h2>
              <label class="row" for="profile-name">
                <span>Name</span>
                <input
                  type="text"
                  id="profile-name"
                  maxlength="20"
                  autocomplete="off"
                  autocapitalize="words"
                  enterkeyhint="done"
                />
              </label>
              <fieldset>
                <legend>Avatar</legend>
                <!-- One radio per avatar, built from profile.ts by main.ts so
                     the shipped list has a single source of truth. -->
                <div class="avatar-grid" id="avatar-grid"></div>
              </fieldset>
              <fieldset>
                <legend>Your record</legend>
                <div class="record-row"><span>Current level</span><strong id="record-level">1</strong></div>
                <div class="record-row"><span>Levels cleared</span><strong id="record-cleared">0</strong></div>
                <div class="record-row"><span>Best score</span><strong id="record-best">0</strong></div>
                <div class="record-row"><span>Daily Challenge streak</span><strong id="record-streak">0</strong></div>
                <div class="record-row"><span>Trophies</span><strong id="record-trophies">0</strong></div>
                <p class="record-hint">
                  Streaks and trophies start counting when the Daily Challenge arrives.
                </p>
              </fieldset>
              <button id="profile-close" type="button">Done</button>
            </div>
          </div>
          <div id="changelog" role="dialog" aria-modal="true" aria-labelledby="changelog-title">
            <div class="card">
              <h2 id="changelog-title">What’s new</h2>
              <!-- Filled from the bundled CHANGELOG.md by main.ts (issue #81). -->
              <div id="changelog-body"></div>
              <button id="changelog-close" type="button">Done</button>
            </div>
          </div>
          <div id="settings" role="dialog" aria-modal="true" aria-labelledby="settings-title">
            <div class="card">
              <h2 id="settings-title">Settings</h2>
              <!-- The player (issue #69): who these settings belong to. Tapping
                   the row opens the profile screen — name, avatar, record. -->
              <button id="btn-profile" type="button" class="row profile-row">
                <span class="avatar-glyph" id="profile-row-glyph" aria-hidden="true">🏮</span>
                <span>
                  <strong id="profile-row-name">Player</strong>
                  <span class="hint">Tap to see your record, or change your name and avatar.</span>
                </span>
              </button>
              <!-- Audio and haptics are separate checkboxes on purpose: spec §7
                   wants them independently toggleable, both ON by default. -->
              <label class="row" for="set-audio">
                <input type="checkbox" id="set-audio" />
                <span>Sound effects</span>
              </label>
              <label class="row" for="set-haptics">
                <input type="checkbox" id="set-haptics" />
                <span>Vibration</span>
              </label>
              <label class="row" for="set-timed">
                <input type="checkbox" id="set-timed" />
                <span>
                  Show a timer
                  <span class="hint">Counts up. There is never a time limit.</span>
                </span>
              </label>
              <label class="row" for="set-ads">
                <input type="checkbox" id="set-ads" />
                <span>
                  Show ads
                  <span class="hint">Off by default. The game is complete without them.</span>
                </span>
              </label>
              <!-- Issue #44: OR'd with the OS prefers-reduced-motion in main.ts,
                   so a player whose OS pref is off can still ask for less motion
                   here — and one whose OS pref is on needs no toggle. -->
              <label class="row" for="set-reduced-motion">
                <input type="checkbox" id="set-reduced-motion" />
                <span>
                  Reduced motion
                  <span class="hint">Matched tiles fade out instead of flying together.</span>
                </span>
              </label>
              <!-- Issue #45 item 5: the depth cues (shadow, side shading, layer
                   value shift) are meant to carry the board on their own, so this
                   is an aid rather than the fix — off by default. -->
              <label class="row" for="set-highlight-free">
                <input type="checkbox" id="set-highlight-free" />
                <span>
                  Highlight free tiles
                  <span class="hint">Dims the tiles that are covered or hemmed in.</span>
                </span>
              </label>
              <fieldset>
                <legend>Tile size</legend>
                <label class="row" for="set-size-s">
                  <input type="radio" name="tile-size" id="set-size-s" value="s" />
                  <span>Small</span>
                </label>
                <label class="row" for="set-size-m">
                  <input type="radio" name="tile-size" id="set-size-m" value="m" />
                  <span>Medium</span>
                </label>
                <label class="row" for="set-size-l">
                  <input type="radio" name="tile-size" id="set-size-l" value="l" />
                  <span>Large</span>
                </label>
                <label class="row" for="set-size-xl">
                  <input type="radio" name="tile-size" id="set-size-xl" value="xl" />
                  <span>Extra large</span>
                </label>
              </fieldset>
              <!-- Issue #81: which build is this? The commit stamp is the
                   load-bearing part; tapping the row opens the changelog. -->
              <button id="btn-version" type="button" class="row version-row">
                <span>
                  Version <strong id="version">dev</strong>
                  <span class="hint">Tap to see what’s new.</span>
                </span>
              </button>
              <button id="settings-close" type="button">Done</button>
            </div>
          </div>
        </div>
      </div>
      <div id="a11y-status" class="sr-only" role="status" aria-live="polite"></div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
