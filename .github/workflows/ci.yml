name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default; a job escalates only if it ever needs to.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: core/package-lock.json
      - name: Core tests (typecheck + unit)
        working-directory: core
        run: |
          npm ci
          npm test
      - name: Bench harness tests
        run: node --test bench/test/*.test.mjs
      - name: Feedback Worker tests (issue #118)
        run: node --test worker/test/*.test.mjs

  # Issue #17 — the spec §11.1 release gate: 10,000 seeds × every shipped layout
  # must generate a provably solvable deal. ~40 s per layout, so it shards one
  # job per layout instead of spending 7 minutes in a single step. The id list
  # comes from /data/layouts itself, so adding a layout file extends the gate
  # with no workflow edit.
  layout-matrix:
    runs-on: ubuntu-latest
    outputs:
      layouts: ${{ steps.ids.outputs.layouts }}
    steps:
      - uses: actions/checkout@v4
      - id: ids
        name: Collect layout ids
        run: |
          ids=$(ls data/layouts/*.json | xargs -n1 basename | sed 's/\.json$//' | jq -R . | jq -sc .)
          echo "layouts=$ids" >> "$GITHUB_OUTPUT"
          echo "::notice::soaking $ids"

  layout-soak:
    needs: layout-matrix
    runs-on: ubuntu-latest
    strategy:
      # One red layout must not hide the state of the other nine.
      fail-fast: false
      matrix:
        layout: ${{ fromJson(needs.layout-matrix.outputs.layouts) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: core/package-lock.json
      - name: Soak 10,000 seeds
        working-directory: core
        # Via env, not `${{ }}` inside the command: matrix values must never be
        # interpolated straight into a shell line.
        env:
          LAYOUT: ${{ matrix.layout }}
        run: |
          npm ci
          npm run build
          node dist/soak.js --layout "$LAYOUT" --seeds 10000

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            core/package-lock.json
            ui/package-lock.json
      - name: Install core (ui's local file dependency)
        working-directory: core
        run: npm ci
      - name: UI tests (typecheck + unit; builds core first)
        working-directory: ui
        run: |
          npm ci
          npm test
      - name: UI production build
        working-directory: ui
        run: npm run build
      - name: Upload web bundle
        uses: actions/upload-artifact@v7
        with:
          name: web-bundle
          path: ui/dist-web
          if-no-files-found: error
          retention-days: 7

  # Issue #15 — playtest deploy. Publishes the exact bundle the `ui` job built and
  # tested, so a red suite can never reach the playtest URL. Only `main` publishes:
  # the target is a Worker serving static assets, where a deploy replaces the live
  # version, so running this on PRs would let any PR overwrite the playtest URL.
  deploy:
    if: github.ref == 'refs/heads/main'
    # layout-soak included: the roadmap makes the §11.1 solvability sweep a
    # permanent release gate, so an unsolvable layout must not reach playtest.
    needs: [test, ui, layout-soak]
    runs-on: ubuntu-latest
    # Only a boolean here, never the token itself: job-level env reaches every
    # step, including third-party actions that have no business holding it.
    env:
      HAS_CLOUDFLARE_CREDS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    # Two quick pushes must not race: an older deploy finishing last would leave
    # the playtest URL behind HEAD.
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: true
    steps:
      # Not for the bundle (that arrives as an artifact) — wrangler-action installs
      # wrangler into the workspace, so it needs a real one.
      - uses: actions/checkout@v4
      # Into the path wrangler.jsonc points `assets.directory` at, so a CI deploy
      # and a local `wrangler deploy` upload the same tree.
      - name: Download web bundle
        uses: actions/download-artifact@v8
        with:
          name: web-bundle
          path: ui/dist-web
      # Secrets are unset until the one-time Cloudflare setup in
      # docs/decisions/0006-web-deploy-cloudflare-pages.md is done; skip rather
      # than fail the run so CI stays green in the meantime.
      # Every argument is fixed in-repo — name and asset directory come from
      # wrangler.jsonc — so nothing interpolated reaches the shell.
      - name: Deploy to Cloudflare
        if: env.HAS_CLOUDFLARE_CREDS == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Cloudflare secrets not configured
        if: env.HAS_CLOUDFLARE_CREDS != 'true'
        run: |
          echo "::notice::Skipped deploy — set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (see docs/decisions/0006-web-deploy-cloudflare-pages.md)."
